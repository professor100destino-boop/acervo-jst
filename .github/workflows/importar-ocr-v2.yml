name: Importar OCR V2

on:
  push:
    paths:
      - '.github/workflows/importar-ocr-v2.yml'
      - 'scripts/aplicar_ocr_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar OCR V2 de 1922
        run: |
          python -m pip install --quiet gdown
          gdown 1D14ksHQotkVBOLe5VDKxYYgfM8ifega7 -O search-index-v2-1922.json
          python - <<'PY'
          import json
          p='search-index-v2-1922.json'
          x=json.load(open(p,encoding='utf-8'))
          assert len(x)==56, f'Esperadas 56 paginas; recebidas {len(x)}'
          assert all(int(i.get('n',0)) in range(1,15) for i in x)
          print('Indice validado:',len(x),'paginas')
          PY
      - name: Integrar OCR V2 ao site
        run: python scripts/aplicar_ocr_v2.py
      - name: Publicar no repositorio
        run: |
          git config user.name 'acervo-jst-bot'
          git config user.email 'acervo-jst-bot@users.noreply.github.com'
          git add search-index-v2-1922.json index.html ano-1922.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao nova.'
          else
            git commit -m 'Publica OCR V2 de 1922'
            git push
          fi
