name: Gerar índice de busca OCR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-search-index.yml"

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip gdown

      - name: Baixar PDFs e gerar índice por página
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess, json, re
          import gdown

          editions = [
              (1, '1 de julho de 1922', '1922-07-01', '1KQhCPGJ59GdnKIiHAEr-tIKPF63zGq8M', '1ixGP5sRnZpFLh4AgTCf5Swwo2piohDs2'),
              (2, '15 de julho de 1922', '1922-07-15', '1SoqgO-2A_S0VJRPk7BGdUDvawzcKjyd9', '1p8HBGX0NDx_K_qzsPDjXABDoBG2REq6r'),
              (3, '29 de julho de 1922', '1922-07-29', '13sfm81t2_FXTBeoY94QBXxZlp2xMGkIF', '17oz902ixq3Iei9j7TtNfqnCho-AAXnJ5'),
              (4, '12 de agosto de 1922', '1922-08-12', '1NeNgAlzg-zdWLK-WI2Im7TSfURcbRzVw', '1AnlQM-JYHd2fu1Lc8Hh3PZ8FmxyzSMJa'),
              (5, '26 de agosto de 1922', '1922-08-26', '1q1nM3YYfxPX1hdzcr_pcUeXs6ZPtAmA-', '1pejqUlbOf69wdsgtiVYhbLk9SJQjCkIH'),
              (6, '9 de setembro de 1922', '1922-09-09', '1kcZTXs0W-hMoN3BNprRHqojzppgmShSh', '1vFUcTdSz0H292G93RwuPI1fj2VIZbFnn'),
              (7, '23 de setembro de 1922', '1922-09-23', '1Blusk7z08r29VYsQXy8Z7VDwCEiy3mJZ', '1j7uKJa81F47PDhHIrCJ5BJyct2dLZzma'),
              (8, '7 de outubro de 1922', '1922-10-07', '1t4rCdgCo7co96G4kDf7lwrIhS5xpiUBl', '1YUzFFKC6aUV7XGmwD1sae79pPsiW7HpR'),
              (9, '21 de outubro de 1922', '1922-10-21', '1Zx70vcA1dZqYqRGlD_Rm74sFdw_hZ_eN', '1aHH0zoGnhFwUqhsZjhiyCCs3gct0h7xk'),
              (10, '4 de novembro de 1922', '1922-11-04', '16bfo0fwlTOxvzSumthNFpVQE_fng7leF', '13aPOss5oEo8JdAIzHvajWrddpYJW0EdM'),
              (11, '18 de novembro de 1922', '1922-11-18', '1i47BRnE0fKZTvKd3gwUOkv1SWxUaI9v-', '1CwHe3a3WI5QFlNNysO9EmgKw7UzZ1rke'),
              (12, '2 de dezembro de 1922', '1922-12-02', '13xmUsCBztM_bkNV-9BXrs0Y4Lvr1wDPj', '1MkiWU4YEVJE7aCHZLQC7GnXTM6Xl9jGG'),
              (13, '16 de dezembro de 1922', '1922-12-16', '1trLmoJU72tWfXLTUpfNLLoeXIGxKQzGb', '1lCSlZOGYdYoRlS3Qg5GsyDS7xpSX4CqN'),
              (14, '30 de dezembro de 1922', '1922-12-30', '1wxMGFSlQ8tXEI1hcLId0_nl75QyCjEBA', '1v7Wewtowvb4QXl6G7FI1TDeGUlzT8XsJ'),
          ]

          work = Path('_ocr_downloads')
          work.mkdir(exist_ok=True)
          index = []

          for number, date_label, iso, pdf_id, original_id in editions:
              pdf = work / f'JST_1922_n{number:02d}_{iso}_OCR.pdf'
              print(f'Baixando edição {number}: {pdf_id}')
              result = gdown.download(id=pdf_id, output=str(pdf), quiet=False)
              if not result or not pdf.exists():
                  raise RuntimeError(f'Falha ao baixar a edição {number}')

              for page in range(1, 5):
                  proc = subprocess.run(
                      ['pdftotext', '-enc', 'UTF-8', '-f', str(page), '-l', str(page), '-nopgbrk', str(pdf), '-'],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=True,
                  )
                  text = proc.stdout.decode('utf-8', errors='replace')
                  text = text.replace('\u00ad', '').replace('\x0c', ' ')
                  text = re.sub(r'[\t\r\n ]+', ' ', text).strip()
                  text = re.sub(r'([^\wÀ-ÿ])\1{5,}', r'\1\1', text)
                  index.append({
                      'n': number,
                      'date': date_label,
                      'iso': iso,
                      'page': page,
                      'pdf': pdf_id,
                      'original': original_id,
                      'text': text,
                  })

          Path('search-index.json').write_text(
              json.dumps(index, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8',
          )
          print(f'Índice concluído: {len(index)} páginas.')
          PY

      - name: Publicar índice no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search-index.json
          if git diff --cached --quiet; then
            echo "O índice não mudou."
          else
            git commit -m "Gera índice textual das 56 páginas"
            git push
          fi
