name: Simplificar capa do acervo

on:
  push:
    paths:
      - '.github/workflows/simplificar-capa.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Simplificar interface inicial
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''    <div class="actions">
      <a class="btn" href="#consulta">Pesquisar no acervo</a>
      <a class="btn alt" href="fontes-pdf.json" download>Catálogo das fontes PDF</a>
      <a class="btn alt" href="search-index-all.json" download>Baixar índice OCR</a>
      <a class="btn alt" href="https://drive.google.com/drive/folders/1L1NlYql-Mt9Lnbxw96eT0WWmhWqqMlNI" target="_blank" rel="noopener">Acervo completo no Drive</a>
    </div>'''

          new = '''    <form class="hero-search" id="heroSearchForm">
      <label class="sr-only" for="heroSearch">Pesquisar no acervo</label>
      <input id="heroSearch" type="search" autocomplete="off" placeholder="Digite uma palavra, nome, cidade ou expressão">
      <button class="btn" type="submit">Pesquisar no acervo</button>
    </form>'''

          if old not in s:
              raise SystemExit('Bloco antigo da capa não encontrado')
          s = s.replace(old, new, 1)

          css_anchor = '.btn{display:inline-block;border:0;border-radius:.55rem;padding:.72rem 1rem;background:var(--ouro);color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.btn.alt{background:transparent;border:1px solid currentColor}.btn.dark{background:var(--vinho)}'
          css_new = css_anchor + '\n.hero-search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.65rem;max-width:760px;margin-top:1.35rem}.hero-search input{width:100%;min-width:0;padding:.85rem 1rem;border:1px solid #ffffff80;border-radius:.55rem;background:#fff;color:var(--tinta);box-shadow:0 8px 24px #0002}.hero-search input::placeholder{color:#76695b}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}'
          if css_anchor not in s:
              raise SystemExit('Âncora de CSS não encontrada')
          s = s.replace(css_anchor, css_new, 1)

          mobile_old = '@media(max-width:760px){.hero{grid-template-columns:1fr;padding:2rem 1rem}.paper{display:none}.stats{grid-template-columns:repeat(2,1fr);margin:0;border-radius:0}.search-row{grid-template-columns:1fr}.search-row input,.search-row select{width:100%}}'
          mobile_new = '@media(max-width:760px){.hero{grid-template-columns:1fr;padding:2rem 1rem}.paper{display:none}.stats{grid-template-columns:repeat(2,1fr);margin:0;border-radius:0}.hero-search{grid-template-columns:1fr}.hero-search .btn{width:100%}.search-row{grid-template-columns:1fr}.search-row input,.search-row select{width:100%}}'
          if mobile_old in s:
              s = s.replace(mobile_old, mobile_new, 1)

          js_anchor = "[q,year,sort].forEach(el=>el.addEventListener('input',runSearch));"
          js_new = "$('heroSearchForm').addEventListener('submit',e=>{e.preventDefault();const v=$('heroSearch').value.trim();q.value=v;document.getElementById('consulta').scrollIntoView({behavior:'smooth',block:'start'});runSearch();});\n" + js_anchor
          if js_anchor not in s:
              raise SystemExit('Âncora de JavaScript não encontrada')
          s = s.replace(js_anchor, js_new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplifica capa e adiciona busca direta"
          git push origin main
