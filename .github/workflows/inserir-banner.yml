name: Inserir banner do acervo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inserir-banner.yml'

permissions:
  contents: write

jobs:
  atualizar-site:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Inserir banner na página inicial
        run: |
          python - <<'PY'
          from pathlib import Path

          arquivo = Path('index.html')
          html = arquivo.read_text(encoding='utf-8')

          if 'class="site-banner"' in html:
              raise SystemExit(0)

          css = '''
.site-banner{width:100%;background:#241917;border-bottom:4px solid var(--ouro);overflow:hidden}
.site-banner img{display:block;width:100%;height:auto;max-height:520px;object-fit:cover;object-position:center}
@media(max-width:700px){.site-banner img{min-height:170px;object-fit:cover}}
'''
          banner = '''<div class="site-banner"><img src="https://drive.google.com/thumbnail?id=11xqYzCHRJf-0hYuRJzg98Cmk1CK1Kyb8&sz=w2000" alt="Santuário da Trindade — Acervo Digital do Jornal Santuário da Trindade"></div>'''

          html = html.replace('</style>', css + '</style>', 1)
          html = html.replace('<body>', '<body>' + banner, 1)
          arquivo.write_text(html, encoding='utf-8')
          PY

      - name: Publicar alteração
        run: |
          if git diff --quiet; then
            echo "Banner já estava presente."
            exit 0
          fi
          git config user.name "Professor 100 Destino"
          git config user.email "professor100destino@gmail.com"
          git add index.html
          git commit -m "Insere banner do acervo na página inicial"
          git push
