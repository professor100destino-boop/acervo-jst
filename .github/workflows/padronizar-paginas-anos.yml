name: Padronizar paginas anuais como 1922

on:
  push:
    paths:
      - 'scripts/padronizar_paginas_anos.py'
      - '.github/workflows/padronizar-paginas-anos.yml'

permissions:
  contents: write

jobs:
  padronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Gerar paginas anuais
        run: python scripts/padronizar_paginas_anos.py

      - name: Publicar paginas padronizadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ano-1923.html ano-1924.html ano-1925.html ano-1926.html ano-1927.html ano-1928.html ano-1929.html ano-1930.html index.html documentacao/PADRONIZACAO_ANOS_1923_1930.json
          if git diff --cached --quiet; then
            echo 'Sem alteracoes.'
          else
            git commit -m 'Padroniza anos 1923 a 1930 no modelo de 1922'
            git push origin main
          fi
