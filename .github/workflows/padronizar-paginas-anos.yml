name: Padronizar páginas anuais como 1922

on:
  push:
    paths:
      - '.github/workflows/padronizar-paginas-anos.yml'

permissions:
  contents: write

jobs:
  padronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Gerar páginas anuais por edição
        run: |
          python <<'PY'
          import json, re, html, unicodedata
          from pathlib import Path
          from datetime import date

          ROOT=Path('.')
          MONTHS={1:'janeiro',2:'fevereiro',3:'março',4:'abril',5:'maio',6:'junho',7:'julho',8:'agosto',9:'setembro',10:'outubro',11:'novembro',12:'dezembro'}
          MONTH_NUM={v:k for k,v in MONTHS.items()}
          MONTH_NUM.update({'marco':3})

          def norm(s):
              s=unicodedata.normalize('NFD',str(s or ''))
              s=''.join(c for c in s if unicodedata.category(c)!='Mn')
              return re.sub(r'\s+',' ',s).lower().strip()

          def load_json(path):
              p=ROOT/path
              if not p.exists(): return []
              return json.loads(p.read_text(encoding='utf-8'))

          base=load_json('search-index-all.json')
          allpages={y:[] for y in range(1923,1931)}
          for p in base:
              y=int(p.get('year') or 1922)
              if 1923 <= y <= 1926:
                  allpages[y].append(p)

          extras={
            1927:['search-index-1927.json'],
            1928:['search-index-1928-p1.json','search-index-1928-p70.json','search-index-1928-p153.json'],
            1929:['search-index-1929.json'],
            1930:['search-index-1930.json'],
          }
          for y,files in extras.items():
              for f in files: allpages[y].extend(load_json(f))

          # Fonte anual original para anos que já possuem PDFs separados por edição.
          annual_original={
            1929:'18ZmFkQPkRL5dSXhwXDbiXr34ifXDR0uo',
            1930:'1Ye6iDuiBClCLLSBhnpyV3lvoEcsKWHbk',
          }

          def gp(p): return int(p.get('globalPage') or p.get('page') or 0)

          def date_from_iso(iso):
              d=date.fromisoformat(iso)
              return f'{d.day} de {MONTHS[d.month]} de {d.year}'

          def detect_header(p,year):
              txt=norm(p.get('text',''))[:2400]
              # O cabeçalho do jornal normalmente traz Anno, Campinas/Trindade, data e Numero.
              cues=sum(k in txt[:1300] for k in ('anno','campinas','santuario','trindade'))
              month_alt='|'.join(sorted(set(MONTH_NUM),key=len,reverse=True))
              dm=re.search(rf'(?<!\d)(\d{{1,2}})\s*(?:de\s*)?({month_alt})\s*(?:de\s*)?{year}(?!\d)',txt)
              if not dm or cues < 2: return None
              day=int(dm.group(1)); month=MONTH_NUM[dm.group(2)]
              try: iso=f'{year:04d}-{month:02d}-{day:02d}'; date.fromisoformat(iso)
              except: return None
              # Primeiro procura o número logo depois da data; depois no cabeçalho inteiro.
              tail=txt[dm.end():dm.end()+450]
              patterns=[
                r'(?:numero|n[u]?mero)\s*[.:º°o-]*\s*(\d{1,4})',
                r'\bn\s*[º°o.]?\s*(\d{1,4})\b',
              ]
              issue=None
              for area in (tail,txt[:1700]):
                  for pat in patterns:
                      m=re.search(pat,area)
                      if m:
                          n=int(m.group(1))
                          if 1 <= n <= 9999: issue=n; break
                  if issue is not None: break
              return {'iso':iso,'issue':issue}

          def build_editions(year,pages):
              pages=sorted(pages,key=gp)
              # Remover duplicações por página global, preferindo registro com mais texto.
              ded={}
              for p in pages:
                  k=gp(p)
                  if not k: continue
                  if k not in ded or len(str(p.get('text',''))) > len(str(ded[k].get('text',''))): ded[k]=p
              pages=[ded[k] for k in sorted(ded)]
              starts=[]
              for p in pages:
                  h=detect_header(p,year)
                  if h:
                      starts.append((gp(p),h,p))
              # 1929/1930 já têm data gravada no índice: usar como reforço se o cabeçalho falhar.
              known={}
              for p in pages:
                  iso=p.get('iso') or p.get('dateIso')
                  if not iso and p.get('date') and re.fullmatch(r'\d{4}-\d{2}-\d{2}',str(p.get('date'))): iso=p.get('date')
                  if iso and str(iso).startswith(str(year)):
                      known.setdefault(str(iso),gp(p))
              existing={h['iso'] for _,h,_ in starts}
              for iso,startg in known.items():
                  if iso not in existing:
                      p=ded.get(startg)
                      if p: starts.append((startg,{'iso':iso,'issue':None},p))
              starts=sorted(starts,key=lambda x:x[0])
              # Eliminar falsos positivos repetidos da mesma data, mantendo a primeira página.
              uniq=[]; seen=set()
              for x in starts:
                  if x[1]['iso'] in seen: continue
                  seen.add(x[1]['iso']); uniq.append(x)
              starts=uniq
              out=[]
              maxg=max([gp(p) for p in pages],default=0)
              for i,(start,h,p0) in enumerate(starts):
                  end=(starts[i+1][0]-1) if i+1<len(starts) else maxg
                  epages=[p for p in pages if start <= gp(p) <= end]
                  if not epages: continue
                  # Se o número não foi lido no primeiro registro, procurar só na primeira página da edição.
                  issue=h['issue']
                  if issue is None:
                      hh=detect_header(epages[0],year)
                      issue=hh['issue'] if hh else None
                  out.append({
                    'year':year,'iso':h['iso'],'issue':issue,'start':start,'end':end,
                    'pages':len(epages),'pdf':epages[0].get('pdf'),
                    'original':epages[0].get('original') or annual_original.get(year),
                  })
              return out,pages

          STYLE='''
          :root{--vinho:#591f22;--vinho2:#2d1719;--ouro:#9b7838;--papel:#f3ead6;--tinta:#2c241b;--fundo:#eee7da}*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--tinta);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit}.top{background:linear-gradient(125deg,var(--vinho2),#68272b);color:#fff;padding:2rem 1rem}.wrap{max-width:1050px;margin:auto}.back{display:inline-block;color:#fff;text-decoration:none;border:1px solid #ffffff88;border-radius:.5rem;padding:.55rem .8rem;margin-bottom:1.3rem}h1{font:700 clamp(2.7rem,9vw,5.8rem)/.95 Georgia,serif;margin:.2rem 0}.lead{max-width:720px}.stats{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1rem}.stat{background:#ffffff15;border:1px solid #ffffff33;border-radius:.6rem;padding:.65rem .9rem}main{max-width:1050px;margin:auto;padding:1.5rem 1rem 4rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1rem}.doc-card{background:#fff;border-radius:.8rem;overflow:hidden;box-shadow:0 8px 24px #0001;border:1px solid #e7ddcd}.doc-head{padding:1.2rem;background:#fff}.doc-head h2{font:700 1.55rem Georgia,serif;margin:.45rem 0}.doc-head p{margin:.25rem 0;color:#665c50}.doc-head small{color:#766b5e}.badge{display:inline-block;background:#e5e3ef;color:#3e3861;padding:.2rem .55rem;border-radius:99px;font-weight:800}.doc-actions{display:flex;gap:.55rem;flex-wrap:wrap;padding:0 1.2rem 1.2rem}.btn{border:0;border-radius:.5rem;padding:.72rem 1rem;background:var(--ouro);color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.btn.secondary{background:var(--vinho)}dialog{width:min(96vw,1000px);height:88vh;border:0;border-radius:.7rem;padding:0}dialog::backdrop{background:#000b}.dh{display:flex;justify-content:space-between;align-items:center;padding:.8rem;background:#2b1b19;color:#fff}.dh button{border:0;border-radius:.4rem;padding:.55rem .75rem;cursor:pointer}.reader-tabs{display:flex;gap:.45rem;align-items:center;padding:.55rem .75rem;background:#efe7d8;border-bottom:1px solid #d8c9b2}.reader-tab,.reader-copy{border:0;border-radius:.45rem;padding:.55rem .8rem;font-weight:800;cursor:pointer;background:#fff;color:var(--vinho)}.reader-tab.active{background:var(--ouro);color:#fff}.reader-copy{margin-left:auto;background:var(--vinho);color:#fff}.reader-pane{height:calc(100% - 111px);overflow:auto;background:#1b1b1b}.hidden{display:none!important}#frame{width:100%;height:100%;border:0}.ocr-text{min-height:100%;padding:1.1rem;background:#faf7ef;color:#272018;font:17px/1.65 Georgia,serif;user-select:text;-webkit-user-select:text;cursor:text}.ocr-page{max-width:850px;margin:0 auto 1rem;background:#fff;border:1px solid #ded3c0;border-radius:.55rem;padding:1rem 1.1rem}.ocr-page h3{margin:.1rem 0 .7rem;color:var(--vinho);font:700 1.15rem Georgia,serif}.ocr-page div{white-space:pre-wrap;user-select:text;-webkit-user-select:text}.ocr-empty,.notice{max-width:850px;margin:0 auto 1rem;background:#fff;border-left:4px solid var(--ouro);border-radius:.45rem;padding:1rem;color:#554a3c}@media(max-width:620px){.doc-actions .btn{flex:1;text-align:center}.reader-copy{font-size:.82rem;padding:.5rem .6rem}}
          '''

          def source_for_range(pages,start,end):
              rel=[p for p in pages if start <= gp(p) <= end]
              return rel[0].get('pdf') if rel else ''

          def make_page(year,eds,pages):
              cards=[]
              for idx,e in enumerate(eds,1):
                  label=date_from_iso(e['iso'])
                  title=f"Edição nº {e['issue']}" if e['issue'] is not None else f"Edição {idx}"
                  pdf=e['pdf'] or source_for_range(pages,e['start'],e['end'])
                  buttons=[f'<button class="btn read" data-id="{html.escape(str(pdf or ""))}" data-start="{e["start"]}" data-end="{e["end"]}" data-title="{html.escape(title)}">Ler</button>']
                  if pdf:
                      buttons.append(f'<a class="btn secondary" href="https://drive.google.com/file/d/{html.escape(str(pdf))}/view" target="_blank" rel="noopener">Abrir arquivo</a>')
                  if e.get('original'):
                      buttons.append(f'<a class="btn secondary" href="https://drive.google.com/file/d/{html.escape(str(e["original"]))}/view" target="_blank" rel="noopener">Original</a>')
                  cards.append(f'''<article class="doc-card"><div class="doc-head"><span class="badge">PDF</span><h2>{html.escape(title)}</h2><p>{html.escape(label)}</p><small>{e['pages']} página(s) indexada(s)</small></div><div class="doc-actions">{''.join(buttons)}</div></article>''')
              datafiles=[]
              if year<=1926: datafiles=['search-index-all.json']
              elif year==1927: datafiles=['search-index-1927.json']
              elif year==1928: datafiles=['search-index-1928-p1.json','search-index-1928-p70.json','search-index-1928-p153.json']
              else: datafiles=[f'search-index-{year}.json']
              files_json=json.dumps(datafiles,ensure_ascii=False)
              cards_html='\n'.join(cards) or '<div class="notice"><strong>Nenhuma edição identificada automaticamente.</strong></div>'
              return f'''<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JST {year} — Acervo Digital</title><style>{STYLE}</style></head><body>
<header class="top"><div class="wrap"><a class="back" href="index.html">← Voltar à pesquisa</a><div>ACERVO DIGITAL JST</div><h1>{year}</h1><p class="lead">Ano organizado em edições separadas, no mesmo padrão de consulta de 1922.</p><div class="stats"><div class="stat"><strong>{len(eds)}</strong> arquivo(s)/edição(ões)</div><div class="stat"><strong>{len(pages)}</strong> páginas indexadas</div></div></div></header>
<main><div class="grid">{cards_html}</div></main>
<dialog id="dlg"><div class="dh"><strong id="ttl">Leitor</strong><button id="close">Fechar</button></div><div class="reader-tabs"><button id="tabPdf" class="reader-tab active" type="button">Jornal</button><button id="tabOcr" class="reader-tab" type="button">Texto OCR</button><button id="copyOcr" class="reader-copy hidden" type="button">Copiar texto</button></div><div id="pdfPane" class="reader-pane"><iframe id="frame" title="Leitor do jornal"></iframe></div><div id="ocrPane" class="reader-pane hidden"><div id="ocrText" class="ocr-text" tabindex="0"></div></div></dialog>
<script>
let pages=[];const DATAFILES={files_json};const YEAR={year};const $=id=>document.getElementById(id),dlg=$('dlg'),frame=$('frame'),ttl=$('ttl');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}}[c]));const preview=id=>`https://drive.google.com/file/d/${{id}}/preview`;const gp=p=>Number(p.globalPage||p.page||0);
Promise.all(DATAFILES.map(f=>fetch(f+'?v='+Date.now(),{{cache:'no-store'}}).then(r=>r.ok?r.json():[]).catch(()=>[]))).then(xs=>{{pages=xs.flat().filter(p=>Number(p.year||YEAR)===YEAR).sort((a,b)=>gp(a)-gp(b));}});
function renderOcr(start,end){{const rel=pages.filter(p=>gp(p)>=start&&gp(p)<=end);const box=$('ocrText');if(!rel.length){{box.innerHTML='<div class="ocr-empty"><strong>Texto OCR ainda não disponível para esta edição.</strong></div>';return}}box.innerHTML=rel.map((p,i)=>`<article class="ocr-page"><h3>Página ${{i+1}} da edição · página ${{gp(p)}} do volume</h3><div>${{esc(p.text||'')}}</div></article>`).join('')}}
function tab(which){{const ocr=which==='ocr';$('pdfPane').classList.toggle('hidden',ocr);$('ocrPane').classList.toggle('hidden',!ocr);$('tabPdf').classList.toggle('active',!ocr);$('tabOcr').classList.toggle('active',ocr);$('copyOcr').classList.toggle('hidden',!ocr);if(ocr)$('ocrText').focus({{preventScroll:true}})}}
document.addEventListener('click',e=>{{const b=e.target.closest('.read');if(!b)return;const id=b.dataset.id;ttl.textContent=b.dataset.title;frame.src=id?preview(id):'about:blank';renderOcr(Number(b.dataset.start),Number(b.dataset.end));tab('pdf');dlg.showModal()}});$('close').onclick=()=>{{frame.src='about:blank';dlg.close()}};$('tabPdf').onclick=()=>tab('pdf');$('tabOcr').onclick=()=>tab('ocr');$('copyOcr').onclick=async()=>{{const text=$('ocrText').innerText;try{{await navigator.clipboard.writeText(text);$('copyOcr').textContent='Copiado!';setTimeout(()=>$('copyOcr').textContent='Copiar texto',1400)}}catch(e){{const r=document.createRange();r.selectNodeContents($('ocrText'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}}}};
</script></body></html>'''

          summary={}
          editions_by_year={}
          for y in range(1923,1931):
              eds,pages=build_editions(y,allpages[y])
              editions_by_year[y]=eds
              summary[str(y)]={
                'edicoes_identificadas':len(eds),
                'paginas_indexadas':len(pages),
                'com_numero_impresso':sum(e['issue'] is not None for e in eds),
                'primeira_data':eds[0]['iso'] if eds else None,
                'ultima_data':eds[-1]['iso'] if eds else None,
              }
              (ROOT/f'ano-{y}.html').write_text(make_page(y,eds,pages),encoding='utf-8')

          Path('documentacao/PADRONIZACAO_ANOS_1923_1930.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')

          # Atualizar no índice principal os cartões dos anos para refletirem edições, não partes de PDF.
          ip=ROOT/'index.html'
          if ip.exists():
              s=ip.read_text(encoding='utf-8')
              for y in range(1923,1931):
                  n=len(editions_by_year[y])
                  # Mantém folder/id já existente e troca apenas label e contador files.
                  pat=rf"\{{year:{y},label:'[^']*',files:\d+,folder:'([^']+)'\}}"
                  m=re.search(pat,s)
                  if m:
                      repl=f"{{year:{y},label:'Ano organizado em edições separadas',files:{n},folder:'{m.group(1)}'}}"
                      s=re.sub(pat,repl,s,count=1)
              ip.write_text(s,encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Validar resultado
        run: |
          python - <<'PY'
          import json, pathlib, sys
          d=json.loads(pathlib.Path('documentacao/PADRONIZACAO_ANOS_1923_1930.json').read_text())
          bad=[]
          for y,v in d.items():
              if v['paginas_indexadas'] and not v['edicoes_identificadas']:
                  bad.append(y)
          if bad:
              raise SystemExit('Falha ao identificar edições nos anos: '+', '.join(bad))
          for y in range(1923,1931):
              t=pathlib.Path(f'ano-{y}.html').read_text()
              assert 'doc-card' in t and 'Edição' in t and 'Abrir arquivo' in t
          print('Validação concluída.')
          PY

      - name: Publicar páginas padronizadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ano-1923.html ano-1924.html ano-1925.html ano-1926.html ano-1927.html ano-1928.html ano-1929.html ano-1930.html index.html documentacao/PADRONIZACAO_ANOS_1923_1930.json
          if git diff --cached --quiet; then
            echo 'Sem alterações.'
          else
            git commit -m 'Padroniza anos 1923 a 1930 no modelo de 1922'
            git push origin main
          fi
