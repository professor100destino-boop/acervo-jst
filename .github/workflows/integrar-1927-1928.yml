name: Integrar 1927 e 1928 ao acervo

on:
  push:
    paths:
      - '.github/workflows/integrar-1927-1928.yml'

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar ferramentas
        run: |
          python -m pip install --quiet gdown pymupdf

      - name: Baixar PDFs do Drive
        run: |
          mkdir -p /tmp/jst
          gdown 'https://drive.google.com/uc?id=1rTFTBK7OQg9gSXv16aCkJkKMR0e9Nz1M' -O '/tmp/jst/1927.pdf'
          gdown 'https://drive.google.com/uc?id=18P2FN0W5-QopXNabTdJJM0M5ioc7rwBU' -O '/tmp/jst/1928-p1.pdf'
          gdown 'https://drive.google.com/uc?id=1F72p2WT4nzzfSs8kjD9eaP4VHnOzmqoE' -O '/tmp/jst/1928-p70.pdf'
          gdown 'https://drive.google.com/uc?id=1fiK7v18EJMDkTZWtuYBLsB-3PErl-Eqh' -O '/tmp/jst/1928-p153.pdf'

      - name: Gerar índices de pesquisa
        run: |
          python <<'PY'
          import fitz, json, re
          from pathlib import Path

          sources = [
              (1927, '/tmp/jst/1927.pdf', '1rTFTBK7OQg9gSXv16aCkJkKMR0e9Nz1M', 1, 'search-index-1927.json', 'JST 1927 — ano completo'),
              (1928, '/tmp/jst/1928-p1.pdf', '18P2FN0W5-QopXNabTdJJM0M5ioc7rwBU', 1, 'search-index-1928-p1.json', 'JST 1928 — páginas 1–69'),
              (1928, '/tmp/jst/1928-p70.pdf', '1F72p2WT4nzzfSs8kjD9eaP4VHnOzmqoE', 70, 'search-index-1928-p70.json', 'JST 1928 — páginas 70–152'),
              (1928, '/tmp/jst/1928-p153.pdf', '1fiK7v18EJMDkTZWtuYBLsB-3PErl-Eqh', 153, 'search-index-1928-p153.json', 'JST 1928 — páginas 153–194'),
          ]

          def clean(t):
              t = t.replace('\x00', ' ')
              t = re.sub(r'[\t\r\f\v]+', ' ', t)
              t = re.sub(r'\n+', ' ', t)
              t = re.sub(r' {2,}', ' ', t)
              return t.strip()

          totals = {}
          for year, path, pdfid, start, outfile, title in sources:
              doc = fitz.open(path)
              pages = []
              for i, page in enumerate(doc):
                  global_page = start + i
                  pages.append({
                      'year': year,
                      'globalPage': global_page,
                      'page': global_page,
                      'localPage': i + 1,
                      'sourceStart': start,
                      'pdf': pdfid,
                      'title': title,
                      'text': clean(page.get_text('text')),
                  })
              Path(outfile).write_text(json.dumps(pages, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
              totals[year] = totals.get(year, 0) + len(pages)
              print(outfile, len(pages), 'páginas')

          if totals.get(1927) != 107:
              raise SystemExit(f'1927 deveria ter 107 páginas; encontrado {totals.get(1927)}')
          if totals.get(1928) != 194:
              raise SystemExit(f'1928 deveria ter 194 páginas; encontrado {totals.get(1928)}')
          PY

      - name: Atualizar interface do site
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('com busca no texto reconhecido por OCR entre 1922 e 1927.', 'com busca no texto reconhecido por OCR entre 1922 e 1928.')
          s = s.replace('<title>Acervo Digital JST — Pesquisa 1922–1927</title>', '<title>Acervo Digital JST — Pesquisa 1922–1928</title>')
          s = s.replace('<div><strong>6</strong>anos em PDF</div>', '<div><strong>7</strong>anos em PDF</div>')
          s = s.replace('<div><strong>1922–1927</strong>período disponível</div>', '<div><strong>1922–1928</strong>período disponível</div>')
          s = s.replace('<option>1927</option>', '<option>1927</option><option>1928</option>', 1)

          old_year = "{year:1927,label:'Janeiro a maio em quatro partes PDF',files:4,folder:'1yyAZHT_y_VqjNWxMoRh5Qr5J0VZJrv3m'}];"
          new_year = "{year:1927,label:'Ano completo em PDF',files:1,folder:'1yyAZHT_y_VqjNWxMoRh5Qr5J0VZJrv3m'},\n{year:1928,label:'Ano completo em três partes PDF',files:3,folder:'1yNHV6vMW9c14rmuBa1xD1pKK9UnzGBdW'}];"
          if old_year not in s:
              raise SystemExit('Cadastro antigo de 1927 não encontrado')
          s = s.replace(old_year, new_year, 1)

          old_load = """    pages=await r.json();
    pages=pages.map(p=>({...p,year:Number(p.year||1922)}));"""
          new_load = """    let base=await r.json();
    base=base.map(p=>({...p,year:Number(p.year||1922)}));
    const extraFiles=['search-index-1927.json','search-index-1928-p1.json','search-index-1928-p70.json','search-index-1928-p153.json'];
    const extras=[];
    for(const f of extraFiles){
      const x=await fetch(`${f}?v=${Date.now()}`,{cache:'no-store'});
      if(!x.ok)throw new Error(`índice adicional indisponível: ${f}`);
      extras.push(await x.json());
    }
    pages=base.filter(p=>Number(p.year||1922)!==1927).concat(...extras);
    pages=pages.map(p=>({...p,year:Number(p.year||1922)}));"""
          if old_load not in s:
              raise SystemExit('Bloco de carregamento do índice não encontrado')
          s = s.replace(old_load, new_load, 1)

          old_coverage = 'Entram na busca os materiais que já estavam em PDF: 1922, 1923, 1924, 1925, 1926 e a primeira parte de 1927. A documentação de junho de 1927 até 1931 está em JPG e ainda não integra este índice.'
          new_coverage = 'Entram na busca os materiais disponíveis em PDF de 1922 a 1928. O ano de 1927 agora está completo, e 1928 foi incorporado integralmente em três partes. Os anos posteriores serão acrescentados conforme forem convertidos para PDF e indexados.'
          if old_coverage in s:
              s = s.replace(old_coverage, new_coverage, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar índices e atualização
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html search-index-1927.json search-index-1928-p1.json search-index-1928-p70.json search-index-1928-p153.json
          git commit -m 'Integra 1927 completo e 1928 à busca do acervo'
          git push origin main
