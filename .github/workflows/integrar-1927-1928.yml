name: Integrar 1927 e 1928 ao acervo

on:
  push:
    paths:
      - '.github/workflows/integrar-1927-1928.yml'

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar ferramentas
        run: python -m pip install --quiet gdown pymupdf

      - name: Gerar índices e atualizar site
        run: python scripts/integrar_1927_1928.py

      - name: Publicar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html search-index-1927.json search-index-1928-p1.json search-index-1928-p70.json search-index-1928-p153.json
          git commit -m "Integra 1927 completo e 1928 à busca do acervo"
          git push origin main
