name: Atualizar páginas anuais e leitor OCR

on:
  push:
    paths:
      - '.github/workflows/paginas-anuais-leitor-ocr.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Gerar páginas e leitor OCR
        run: python scripts/atualizar_paginas_anuais.py

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ano-1922.html ano-1923.html ano-1924.html ano-1925.html ano-1926.html ano-1927.html
          git commit -m "Adiciona páginas anuais e texto OCR selecionável no leitor"
          git push origin main
