name: Aplicar banner histórico JST

on:
  push:
    paths:
      - '.github/workflows/aplicar-banner-jst.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Baixar arte do banner
        run: |
          python -m pip install --quiet gdown
          mkdir -p assets
          gdown --id 1_a5HMudOZmEr82BLtvX1bqK16Zy8yb7O -O assets/banner_acervo_jst.png
          test -s assets/banner_acervo_jst.png

      - name: Substituir capa marrom pela arte histórica
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          new_header = '''<header class="hero hero-image">
  <img class="hero-banner" src="assets/banner_acervo_jst.png" alt="Santuário da Trindade — Órgam do Santuário da Trindade — Acervo Digital do Jornal Santuário da Trindade (1920–1970)">
</header>
<section class="banner-search" aria-label="Pesquisa no acervo">
  <form class="hero-search" id="heroSearchForm">
    <label class="sr-only" for="heroSearch">Pesquisar no acervo</label>
    <input id="heroSearch" type="search" autocomplete="off" placeholder="Digite uma palavra, nome, cidade ou expressão">
    <button class="btn" type="submit">Pesquisar no acervo</button>
  </form>
</section>'''

          s, n = re.subn(r'<header class="hero">.*?</header>', new_header, s, count=1, flags=re.S)
          if n != 1:
              # aceita eventual classe extra no header
              s, n = re.subn(r'<header class="hero[^\"]*">.*?</header>', new_header, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Cabeçalho principal não encontrado')

          css = '''
/* Banner histórico JST */
.hero.hero-image{display:block!important;padding:0!important;background:#efe1bd!important;color:inherit!important;min-height:0!important}
.hero-banner{display:block;width:100%;height:auto;max-height:none;object-fit:contain;background:#efe1bd}
.banner-search{background:#efe6d3;padding:1rem;border-bottom:1px solid #d2c3a6;box-shadow:0 5px 18px #00000012}
.banner-search .hero-search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.7rem;max-width:1080px;margin:0 auto}
.banner-search .hero-search input{width:100%;min-width:0;padding:.9rem 1rem;border:1px solid #b8aa92;border-radius:.55rem;background:#fff;color:var(--tinta);box-shadow:0 4px 12px #00000010}
@media(max-width:760px){.hero.hero-image{padding:0!important}.hero-banner{width:100%;height:auto}.banner-search .hero-search{grid-template-columns:1fr}.banner-search .hero-search .btn{width:100%}}
'''
          if '/* Banner histórico JST */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/banner_acervo_jst.png
          git commit -m "Substitui capa marrom pelo banner histórico JST"
          git push origin main
